name: Quiz 結果コメント

on:
  workflow_run:
    workflows: ['Quiz 自動判定']
    types: [completed]

permissions:
  pull-requests: write
  issues: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Artifact をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: quiz-result
          path: quiz-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 結果を読み取り
        id: read
        run: |
          echo "pr_number=$(cat quiz-result/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "student_file=$(cat quiz-result/student_file.txt)" >> "$GITHUB_OUTPUT"
          echo "result=$(cat quiz-result/result.txt)" >> "$GITHUB_OUTPUT"

      - name: PR にコメントを投稿
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.read.outputs.pr_number }}', 10);
            const file = '${{ steps.read.outputs.student_file }}';
            const result = '${{ steps.read.outputs.result }}';

            if (!prNumber) {
              core.setFailed(`PR番号が取得できませんでした: "${prNumber}"`);
              return;
            }

            let body;
            if (result === 'passed') {
              body = [
                '## ✅ 合格！',
                '',
                `**${file}** で文字をクリックすると、CDN から import した Motion の animate() + stagger() により全文字が中央からスクランブルして TRIDENT に戻っています。`,
                'お疲れ様でした！',
              ].join('\n');
            } else if (result === 'no_file') {
              body = [
                '## ⚠️ ファイルが見つかりません',
                '',
                '`students/{番号}/index.html` が変更されていません。',
                '正しいフォルダに解答を置いてから、再度 push してください。',
              ].join('\n');
            } else {
              body = [
                '## ❌ 不合格',
                '',
                `**${file}** で文字をクリックしても【すべての文字】がスクランブルして TRIDENT に戻りませんでした（1文字だけ動く例のままになっていませんか？）。`,
                '',
                '**確認ポイント**',
                '- 用意済みの「1文字だけの例」を、`letters` を `forEach`（または `for` 文）で回す形に書き換えましたか？',
                '- 各 span を `animate(0, 1, { ... })` でアニメーションしていますか？',
                '- `onUpdate(progress)` で `progress < 1` のとき `randomChar()`、`1` のとき `TARGET[i]` を入れていますか？',
                '- `delay` に `stagger(0.08, { from: \'center\' })` を `stag(i, letters.length)` のように呼び出して渡していますか？',
                '- 用意済みの `import` / HTML の `<span>` / `letters` / `randomChar` を書き換えていませんか？',
                '- `<script>` の `type="module"` を外していませんか？',
                '- 確認用のブラウザ／判定環境がインターネットに接続できていますか？（Motion を CDN から読み込みます）',
                '',
                'コードを修正して再度 push してください。',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
